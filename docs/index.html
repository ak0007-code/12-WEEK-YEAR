<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f3ed">
    <meta name="description" content="12 Week Yearのスマートフォン用デイリーチェック画面">
    <meta name="sync-api" content="https://12-week-year-sync.asahi0107wave-094.workers.dev">
    <title>12 Week Year Check</title>
    <link rel="stylesheet" href="./styles.css?v=20260825-3">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">12 WEEK YEAR</p>
          <h1 id="week-label">Weekly Check</h1>
          <p id="period" class="period"></p>
        </div>
        <div class="topbar-actions">
          <button id="notes-open" class="library-open" type="button" data-library="notes" aria-haspopup="dialog">Notes</button>
          <button id="insights-open" class="library-open" type="button" data-library="insights" aria-haspopup="dialog">Insight</button>
        </div>
      </header>

      <p id="error" class="error" hidden>データを読み込めませんでした。通信状態を確認して、ページを開き直してください。</p>

      <div id="app" hidden>
        <nav id="week-tabs" class="week-tabs" aria-label="週を選択"></nav>
        <nav id="day-tabs" class="day-tabs" aria-label="曜日を選択"></nav>
        <section class="day-panel">
          <div id="checklist"></div>
        </section>
      </div>
    </main>

    <footer class="save-bar">
      <div>
        <strong id="sync-status">端末に自動保存済み</strong>
        <small id="sync-detail">GitHub接続後はREADMEへ自動同期します</small>
      </div>
      <button id="save" type="button" disabled>GitHubと接続</button>
    </footer>

    <div id="library-sheet" class="library-sheet-backdrop" role="dialog" aria-modal="true" aria-labelledby="library-sheet-title" hidden>
      <section class="library-sheet">
        <div class="library-sheet-handle" aria-hidden="true"></div>
        <header class="library-sheet-header">
          <h2 id="library-sheet-title"></h2>
          <button id="library-sheet-close" class="library-sheet-close" type="button" aria-label="閉じる">×</button>
        </header>
        <nav id="library-sheet-list" class="library-sheet-list"></nav>
      </section>
    </div>

    <script type="module" src="./app.js?v=20260825-3"></script>
  </body>
</html>
