name: Create Weekly Check Issue

on:
  workflow_dispatch:
    inputs:
      week:
        description: 作成するWeek
        required: true
        default: "08"
        type: choice
        options:
          - "01"
          - "02"
          - "03"
          - "04"
          - "05"
          - "06"
          - "07"
          - "08"
      prefill_completed:
        description: Notionの実績をチェック済みで反映する
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render issue body
        env:
          WEEK: ${{ inputs.week }}
          PREFILL_COMPLETED: ${{ inputs.prefill_completed }}
        run: |
          options=()
          if [[ "$PREFILL_COMPLETED" != "true" ]]; then
            options+=(--blank)
          fi
          node scripts/weekly-check.mjs \
            --plan "plans/week-$WEEK.json" \
            --body-file /tmp/weekly-check.md \
            "${options[@]}"

      - name: Create labels and issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WEEK: ${{ inputs.week }}
        run: |
          title="$(node scripts/weekly-check.mjs \
            --plan "plans/week-$WEEK.json" \
            --title-only true)"

          existing="$(gh issue list \
            --state all \
            --search "in:title $title" \
            --limit 100 \
            --json title,url \
            --jq ".[] | select(.title == \"$title\") | .url")"

          if [[ -n "$existing" ]]; then
            echo "Issue already exists: $existing"
            exit 0
          fi

          gh label create weekly-check \
            --description "Weekly action checklist" \
            --color 1D76DB \
            --force
          gh label create "week-$WEEK" \
            --description "12 Week Year - Week $((10#$WEEK))" \
            --color 5319E7 \
            --force

          gh issue create \
            --title "$title" \
            --body-file /tmp/weekly-check.md \
            --label weekly-check \
            --label "week-$WEEK"
