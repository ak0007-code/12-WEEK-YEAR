name: Deploy Checklist to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "notes/**"
      - "plans/week-*.json"
      - ".github/workflows/deploy-checklist-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        run: |
          mkdir -p _site/plans _site/notes
          cp -R docs/. _site/
          cp plans/week-*.json _site/plans/
          cp notes/*.md _site/notes/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
