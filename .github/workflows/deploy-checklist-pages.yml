name: Deploy Checklist to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "notes/**"
      - "English/INSIGHT.md"
      - "Health/INSIGHT.md"
      - "Work/INSIGHT.md"
      - "Humanity/INSIGHT.md"
      - "plans/week-*.json"
      - ".github/workflows/deploy-checklist-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for current plans
        id: plans
        run: |
          if compgen -G "plans/week-*.json" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No plans for the current cycle yet; keeping the deployed site."
          fi
      - name: Build static site
        if: steps.plans.outputs.present == 'true'
        run: |
          mkdir -p _site/plans _site/notes _site/insights
          cp -R docs/. _site/
          cp plans/week-*.json _site/plans/
          cp notes/*.md _site/notes/
          cp English/INSIGHT.md _site/insights/English.md
          cp Health/INSIGHT.md _site/insights/Health.md
          cp Work/INSIGHT.md _site/insights/Work.md
          cp Humanity/INSIGHT.md _site/insights/Humanity.md
      - uses: actions/configure-pages@v5
        if: steps.plans.outputs.present == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.plans.outputs.present == 'true'
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.plans.outputs.present == 'true'
        uses: actions/deploy-pages@v4
